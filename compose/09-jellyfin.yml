services:

  jellyfin:

    image: lscr.io/linuxserver/jellyfin:latest

    container_name: jellyfin

    hostname: jellyfin

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    depends_on:

      sonarr:
        condition: service_started

      radarr:
        condition: service_started

    environment:

      - TZ=${TZ}

      - PUID=${PUID}

      - PGID=${PGID}

      - UMASK=002

    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${CACHE_PATH}/jellyfin:/cache
      - ${DATA_PATH}/media:/media:ro

    ports:

      - "8096:8096"

    healthcheck:

      test: ["CMD","curl","-fsS","http://localhost:8096/health"]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 60s

    logging:

      driver: json-file

      options:

        max-size: "10m"

        max-file: "5"

    labels:

      - "traefik.enable=true"

      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"

      - "traefik.http.routers.jellyfin.entrypoints=websecure"

      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

    networks:

      - media

      - proxy

networks:

  media:
    external: true

  proxy:
    external: true